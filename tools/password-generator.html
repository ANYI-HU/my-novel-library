<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木棕書房密碼雜湊產生器</title><style>body{font:16px system-ui;background:#211711;color:#f3ece4;max-width:620px;margin:10vh auto;padding:24px}input,button,textarea{font:inherit;padding:12px;border-radius:6px;border:1px solid #806044}input,textarea{width:100%;box-sizing:border-box;background:#170f0b;color:white;margin:8px 0 14px}button{background:#916b4d;color:white;cursor:pointer}textarea{min-height:100px;word-break:break-all}small{color:#b9a797;line-height:1.8}</style><h1>木棕書房｜密碼設定</h1><p>在此輸入你想設定的書房密碼，產生 SHA-256 雜湊值。</p><label>新密碼</label><input id="pw" type="password" autocomplete="new-password"><button id="go">產生雜湊</button><p>將下方結果複製到 <code>js/config.js</code> 的 ACCESS_PASSWORD_HASH。</p><textarea id="out" readonly placeholder="雜湊值會顯示在這裡"></textarea><small>密碼只在你的瀏覽器中計算，不會傳送到任何伺服器。請勿使用其他重要帳號的密碼。此功能只是一般門檻，不是安全的帳號驗證。</small><script>document.getElementById('go').onclick=async()=>{const p=document.getElementById('pw').value;if(!p){alert('請先輸入密碼');return;}const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));document.getElementById('out').value=Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');};</script></html>
